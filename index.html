<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali – Team Greeting Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@1,500&family=Great+Vibes&display=swap">
<style>
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 50% 40%,#5e1535,#2a0a1a 60%,#10030a);font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;pointer-events:none}
#bg{z-index:1}#fx{z-index:2}
.mandala{position:fixed;left:50%;top:50%;width:min(140vw,1200px);aspect-ratio:1;border-radius:50%;z-index:0;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,200,90,.1) 0 4deg,transparent 4deg 12deg),repeating-radial-gradient(circle,rgba(255,200,90,.12) 0 1px,transparent 1px 70px);-webkit-mask:radial-gradient(circle,transparent 20%,#000 38%,transparent 70%);mask:radial-gradient(circle,transparent 20%,#000 38%,transparent 70%);animation:spin 120s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.shift{--w:min(46vw,54vh,420px);position:relative;z-index:3;margin-bottom:5vh;transition:transform 1.1s cubic-bezier(.645,.045,.355,1)}
.shift[data-s=start]{transform:translateX(calc(var(--w)*-.5))}
.shift[data-s=end]{transform:translateX(calc(var(--w)*.5))}
#book{position:relative;width:calc(var(--w)*2);height:calc(var(--w)*1.38);font-size:calc(var(--w)/21);perspective:2600px}
.base{position:absolute;top:-.8em;bottom:-.8em;background:linear-gradient(#7a1a38,#4a0f26);border:.15em solid #c9962b;box-shadow:0 1.4em 3em rgba(0,0,0,.65),0 0 4em rgba(255,180,60,.18);transition:opacity .8s;z-index:0}
.bl{left:-.8em;width:calc(50% + .8em);border-radius:1.2em 0 0 1.2em;border-right:0}
.br{right:-.8em;width:calc(50% + .8em);border-radius:0 1.2em 1.2em 0;border-left:0}
[data-s=start] .bl,[data-s=end] .br,[data-s=start] .spine,[data-s=end] .spine{opacity:0}
.spine{position:absolute;left:50%;top:0;bottom:0;width:1.4em;margin-left:-.7em;z-index:99;pointer-events:none;transition:opacity .8s;background:linear-gradient(90deg,transparent,rgba(0,0,0,.28) 50%,transparent)}
.sheet{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.645,.045,.355,1),z-index 0s .55s}
.sheet.flip{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;box-sizing:border-box;padding:9% 10%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:#4a1024;overflow:hidden}
.front{border-radius:.3em 1em 1em .3em;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 9%),radial-gradient(ellipse at 50% 40%,#fffaf0,#f1deb0)}
.back{transform:rotateY(180deg);border-radius:1em .3em .3em 1em;background:linear-gradient(270deg,rgba(0,0,0,.2),transparent 9%),radial-gradient(ellipse at 50% 40%,#fffaf0,#f1deb0)}
.face.cov{color:#fbe9c0}
.front.cov{background:linear-gradient(90deg,rgba(0,0,0,.3),transparent 9%),radial-gradient(circle at 50% 35%,#a42349,#4a0f26 75%)}
.back.cov{background:linear-gradient(270deg,rgba(0,0,0,.3),transparent 9%),radial-gradient(circle at 50% 35%,#a42349,#4a0f26 75%)}
.face::before{content:"";position:absolute;inset:4.5%;border:.2em double #c9962b;pointer-events:none}
.face::after{content:"";position:absolute;inset:8%;border:1px solid rgba(201,150,43,.55);pointer-events:none;background:radial-gradient(circle at 0 0,#c9962b 0 .35em,transparent .4em),radial-gradient(circle at 100% 0,#c9962b 0 .35em,transparent .4em),radial-gradient(circle at 0 100%,#c9962b 0 .35em,transparent .4em),radial-gradient(circle at 100% 100%,#c9962b 0 .35em,transparent .4em)}
.cov::before{border-color:#ffd877}
.diya{font-size:3em;line-height:1.2;filter:drop-shadow(0 0 .4em #ff9d1c);animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:scale(1.08)}}
.name{font-family:'Great Vibes','Snell Roundhand',cursive;font-size:2.15em;line-height:1.2;padding:.05em .15em;margin:.05em 0;background:linear-gradient(90deg,#8a5a00,#d9a520,#8a1c3c);-webkit-background-clip:text;background-clip:text;color:transparent}
.cov .name{font-size:3.1em;background-image:linear-gradient(90deg,#ffe9a0,#d4a017,#fff3c4)}
.role{font-family:Cinzel,Georgia,serif;font-size:.48em;letter-spacing:.12em;line-height:1.35;text-transform:none;color:#9a6b0a;margin:.15em 0 .45em}
.cov .role{color:#fbe9c0}
.role::after{content:"❖ ❖ ❖";display:block;margin:.45em 0 .55em;letter-spacing:.6em;color:#c9962b;font-size:1.1em}
.msg{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:.88em;line-height:1.24;margin:0 0 .55em}
.wish{font-family:'Cinzel Decorative',Cinzel,Georgia,serif;font-size:.86em;line-height:1.3;padding:.1em;background:linear-gradient(90deg,#8a1c3c,#c98f10);-webkit-background-clip:text;background-clip:text;color:transparent}
#hint{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:4;font:13px Cinzel,Georgia,serif;letter-spacing:.2em;color:#e8c46a;opacity:.85;pointer-events:none}
</style></head><body>
<div class="mandala"></div><canvas id="bg"></canvas><canvas id="fx"></canvas>
<div id="hint"></div>
<div class="shift" id="shift" data-s="start"><div id="book"><div class="base bl"></div><div class="base br"></div><div class="spine"></div></div></div>
<script>
const D=[
{n:"Amit Godhania",r:"A leader who inspires, a mentor who guides, and a driving force behind our team's success.",p:[
"Your leadership lights the way for all of us, inspiring confidence, encouraging growth, and bringing our team together. Your guidance and trust make every achievement more meaningful and every challenge an opportunity to become better.",
"May this Diwali bring you the same happiness, positivity, and success that you inspire in everyone around you. May your home shine with prosperity, your heart be filled with peace, and the year ahead bring you countless reasons to celebrate."
],w:"Wishing you and your family a very Happy Diwali!",s:"With respect, gratitude, and warm wishes."},
{n:"Sarwshresthan Sinha",r:"A guiding light who leads with patience, support, and inspiration.",p:[
"A great team leader is not just someone who leads the way, but someone who inspires others to believe in themselves. Your guidance, encouragement, and willingness to support the team make every challenge easier and every achievement more meaningful.",
"May this Diwali bring you the happiness you deserve, the success you have worked for, and countless moments of peace and joy with your loved ones. May your leadership continue to inspire, and may the year ahead be filled with wonderful new beginnings."
 ],w:"Wishing you and your family a very Happy Diwali!",s:"With appreciation, respect, and heartfelt wishes."},
{n:"Shabi Abbas Saiyed",p:[
"You are truly an amazing person—someone who is incredibly knowledgeable, talented, calm, and effortlessly cool. Your positive attitude, composed nature, and ability to handle things with such ease make you a wonderful person to work with and learn from.",
"May this Diwali bring you endless happiness, success, good health, and prosperity. May you continue to shine, achieve new milestones, and inspire everyone around you with your knowledge and personality.",
"Keep being the awesome person you are!"
],w:"Wishing you and your family a very Happy and Prosperous Diwali!"},
{n:"Gaurang Dalwadi",p:["May your life always be filled with clarity, positivity, and meaningful opportunities, just as your work brings value through every detail and insight. May this Diwali illuminate your path with success, happiness, and countless reasons to smile."],w:"Wishing you and your family a very Happy Diwali!"},
{n:"Himanshu Tiwari",p:["Just as every shipment finds its way across oceans, may your dreams find their way to success and happiness. May this Diwali bring smooth journeys, new opportunities, and wonderful moments with your loved ones."],w:"Wishing you a bright and prosperous Happy Diwali!"},
{n:"Asif Mohd",p:["Your creativity brings imagination to life, and this Diwali, may life itself create the most beautiful picture for you. May your days be filled with vibrant colors, inspiring ideas, and moments that shine brighter than the most beautiful creation."],w:"Wishing you a spectacular Happy Diwali!"},
{n:"Shivaprasad B",p:["Your attention to detail and commitment to keeping things on track make a meaningful difference. May this Diwali bring peace to your heart, positivity to your days, and new opportunities to grow and shine."],w:"Wishing you and your family a joyful and prosperous Happy Diwali!"},
{n:"Adeeba Khanam",p:["May your life be filled with warmth, happiness, and beautiful little moments that make your heart smile. May this Diwali bring you exciting opportunities, wonderful memories, and all the love and joy you deserve. And may your days be as comforting and delightful as a little cat curled up beside you on a peaceful evening."],w:"¡Te deseo a ti y a tu familia un Diwali lleno de luz, paz y felicidad. ¡Feliz Diwali!"},
{n:"Vijayan Balaji",p:["May your life be filled with beautiful moments, inspiring stories, and happiness that never fades. Just as every frame brings a story to life, may every moment of this Diwali bring you something wonderful. May this Diwali bring you endless creativity, success, and a sparkling Happy Diwali!"],w:"Wishing you a sparkling Happy Diwali!"},
{n:"Huzaifa Shaikh",p:["May this Diwali open the doors to happiness, prosperity, and exciting new beginnings. May your dedication continue to bring you success, and may your home be filled with laughter, warmth, and beautiful memories."],w:"Wishing you a wonderful and blessed Happy Diwali!"},
{n:"Shivangee Mishra",p:["May your kindness, dedication, and positive spirit continue to brighten every place you touch. This Diwali, may you receive as much happiness as you bring to others, along with endless reasons to celebrate. Wishing you a beautiful festival filled with love, laughter, and light."],w:"Happy Diwali!"},
{n:"Keshini Vyas",p:["May this festival of lights remind you of all the wonderful possibilities waiting ahead. May every challenge turn into an opportunity, every effort bring you closer to success, and every day bring a little more happiness."],w:"Wishing you and your loved ones a truly magical Happy Diwali!"},
{n:"Soumya Rao",p:["May the light of Diwali celebrate the wonderful person you are and the positivity you bring to those around you. May your journey ahead be filled with confidence, happiness, and achievements that make you proud."],w:"Wishing you a Diwali as beautiful and special as your brightest dreams!"},
{n:"Fiza Pathan",p:["May your life sparkle with happiness, your heart glow with peace, and your days be filled with beautiful surprises. May this Diwali bring fresh beginnings, wonderful opportunities, and precious moments with the people you love."],w:"Sending you warm wishes for a bright and joyful Happy Diwali!"},
{n:"Jayesh Makhija",p:["May the festival of lights bring new energy to your dreams and new strength to every step you take. May your hard work lead to great achievements, and may your home always be filled with peace, prosperity, and laughter."],w:"Wishing you a fantastic Happy Diwali!"},
{n:"Rohan Mundepi",p:["May this Diwali be the beginning of a journey filled with success, happiness, and unforgettable memories. May every little light remind you that brighter days are always ahead, and may your efforts bring you the rewards you deserve."],w:"Wishing you and your family a prosperous and Happy Diwali!"},
{n:"Zia Khan",p:["May your life shine with the same beautiful radiance as the lights of Diwali. May you always find happiness in the little things, strength in every challenge, and love in every moment. May your festive season be filled with peace, prosperity, and endless smiles."],w:"Happy Diwali!"},
{n:"Rashmi Singh",p:["May this Diwali bring you the happiness you deserve, the peace your heart wishes for, and countless beautiful moments to cherish. May your dedication and hard work continue to open doors to wonderful opportunities, and may every new day bring you closer to your dreams."],w:"Happy Diwali!"},
{n:"Shivani Rana",p:["Every great connection begins with a spark, and may this Diwali bring countless wonderful connections into your life. May your confidence grow, your dreams reach new heights, and every new beginning lead to something beautiful. Wishing you a festive season full of happiness, success, and positivity."],w:"Happy Diwali!"},
{n:"Akash Singh",p:["May the sky of your dreams always be filled with the brightest stars of success and happiness. May this Diwali bring fresh opportunities, beautiful memories, and the confidence to achieve everything you aspire to."],w:"Wishing you and your family a sparkling and prosperous Happy Diwali!"},
{n:"Jyoti Malhotra",p:["May your life be filled with balance, abundance, and the beautiful rewards of your hard work. Just as every detail matters in your work, may every little moment of this Diwali bring you joy and gratitude. Wishing you a year filled with financial prosperity, personal happiness, and a wonderful Happy Diwali!"],w:"Have a wonderful Happy Diwali!"},
{n:"Philip Bhosle",p:["May this Diwali bring you the happiness of a beautiful home, the joy of a supportive team, and the satisfaction of achieving your dreams. May every new day bring fresh possibilities and every festive light fill your heart with hope."],w:"Wishing you and your loved ones a very Happy Diwali!"},
{n:"Bhavin Parmar",p:["May your dedication and determination continue to light the way toward wonderful achievements. May this Diwali fill your home with warmth, your heart with peace, and your future with exciting opportunities. "],w:"Wishing you a joyful celebration and a year full of success. Happy Diwali!"},
{n:"Shireen Pathan",p:["May this Diwali bring a beautiful glow to your life and fill every corner of your world with love and happiness. May your efforts be appreciated, your dreams find their wings, and your days be filled with countless blessings."],w:"Sending you warm wishes for a peaceful, prosperous, and Happy Diwali!"},
{n:"Kasturee Saikia",p:["May this Diwali bring new colors to your life, new hopes to your heart, and new happiness to every day. May the festive lights guide you toward wonderful opportunities and may your home always be filled with love, laughter, and peace."],w:"Wishing you a beautiful and blessed Happy Diwali!"}
];
const $=id=>document.getElementById(id),book=$('book'),shift=$('shift'),hint=$('hint');
const pages=[{c:1,h:`<div class="diya">🪔</div><div class="name">Happy Diwali</div><div class="role">Wishes for our wonderful team</div><p class="msg">Click anywhere or press the right arrow to open</p>`}];
D.forEach(d=>{
 const subtitle=d.r?`<div class="role">${d.r}</div>`:"";
 const paragraphs=d.p.map(p=>`<p class="msg">${p}</p>`).join("");
 const signoff=d.s?`<p class="msg">${d.s}</p>`:"";
 pages.push({h:`<div class="diya">🪔</div><div class="name">${d.n}</div>${subtitle}${paragraphs}<div class="wish">${d.w} ✨</div>${signoff}`});
});
pages.push({c:1,h:`<div class="diya">🪔</div><div class="name">Thank You</div><div class="role">For lighting up our team</div><p class="msg">Wishing everyone a safe, bright and joyful Diwali and a very Happy New Year!</p>`});
const N=Math.ceil(pages.length/2),sheets=[];
for(let i=0;i<N;i++){const a=pages[2*i],b=pages[2*i+1]||{h:''},s=document.createElement('div');s.className='sheet';
s.innerHTML=`<div class="face front${a.c?' cov':''}">${a.h}</div><div class="face back${b.c?' cov':''}">${b.h}</div>`;book.appendChild(s);sheets.push(s)}
let idx=0,fxOn=0;
function go(n){idx=Math.max(0,Math.min(N,n));
sheets.forEach((s,i)=>{s.classList.toggle('flip',i<idx);s.style.zIndex=i<idx?i+1:N-i});
shift.dataset.s=idx==0?'start':idx==N?'end':'mid';
hint.textContent=idx==0?'Cover':idx==N?'The End':`Pages ${2*idx} – ${2*idx+1} of ${pages.length}`;
if(fxOn){burst(innerWidth/2,innerHeight*.45,30);}}
document.addEventListener('click',e=>{const r=book.getBoundingClientRect();go(e.clientX>r.left+r.width/2?idx+1:idx-1)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});

/* ---------- effects: lanterns, diyas, crackers ---------- */
const cb=$('bg').getContext('2d'),cx=$('fx').getContext('2d');let W,H,t=0;
function rs(){W=$('bg').width=$('fx').width=innerWidth;H=$('bg').height=$('fx').height=innerHeight}rs();addEventListener('resize',rs);
const P=[],R=[],E=[],HU=[45,20,340,130,200,50,290];
const Ls=Array.from({length:9},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:14+Math.random()*16,v:.25+Math.random()*.4,p:Math.random()*6,h:Math.random()*25}));
function burst(x,y,n,h){const b=h??HU[Math.random()*HU.length|0];for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*5+.8;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:75+Math.random()*40,m:115,h:b+Math.random()*30-15,s:1.7,g:.05,f:.984})}}
function lantern(o){cb.save();cb.translate(o.x,o.y);cb.rotate(Math.sin(t/70+o.p)*.07);const s=o.s;
cb.globalCompositeOperation='lighter';let g=cb.createRadialGradient(0,0,0,0,0,s*3);g.addColorStop(0,'rgba(255,170,60,.38)');g.addColorStop(1,'rgba(255,100,20,0)');cb.fillStyle=g;cb.fillRect(-s*3,-s*3,s*6,s*6);
cb.globalCompositeOperation='source-over';g=cb.createLinearGradient(-s,0,s,0);g.addColorStop(0,`hsl(${5+o.h},85%,38%)`);g.addColorStop(.5,`hsl(${25+o.h},95%,58%)`);g.addColorStop(1,`hsl(${5+o.h},85%,38%)`);
cb.fillStyle=g;cb.beginPath();cb.ellipse(0,0,s*.8,s,0,0,6.283);cb.fill();
cb.strokeStyle='rgba(255,215,120,.55)';cb.lineWidth=1;[.35,.7].forEach(k=>{cb.beginPath();cb.ellipse(0,0,s*.8*k,s,0,0,6.283);cb.stroke()});
cb.fillStyle='#d4a017';cb.fillRect(-s*.35,-s-3,s*.7,4);cb.fillRect(-s*.35,s-1,s*.7,4);
cb.strokeStyle='#d4a017';cb.beginPath();cb.moveTo(0,s+3);cb.lineTo(0,s+s*.8);cb.stroke();cb.restore()}
function diya(x,y,ph){const f=1+Math.sin(t/7+ph)*.12+Math.sin(t/3+ph*2)*.07;
cb.globalCompositeOperation='lighter';let g=cb.createRadialGradient(x,y-14,0,x,y-14,46);g.addColorStop(0,`rgba(255,170,50,${.4*f})`);g.addColorStop(1,'rgba(255,120,20,0)');cb.fillStyle=g;cb.fillRect(x-50,y-62,100,100);
cb.globalCompositeOperation='source-over';
g=cb.createLinearGradient(0,y-8,0,y+12);g.addColorStop(0,'#d2691e');g.addColorStop(1,'#6b2408');cb.fillStyle=g;
cb.beginPath();cb.moveTo(x-21,y-8);cb.quadraticCurveTo(x,y+22,x+21,y-8);cb.closePath();cb.fill();
cb.strokeStyle='#e8b923';cb.lineWidth=2;cb.beginPath();cb.moveTo(x-21,y-8);cb.lineTo(x+21,y-8);cb.stroke();
g=cb.createLinearGradient(0,y-8-22*f,0,y-8);g.addColorStop(0,'#ff8a00');g.addColorStop(.6,'#ffd34d');g.addColorStop(1,'#fff6c8');cb.fillStyle=g;
cb.beginPath();cb.moveTo(x,y-10-22*f);cb.quadraticCurveTo(x+8,y-18,x,y-8);cb.quadraticCurveTo(x-8,y-18,x,y-10-22*f);cb.fill()}
function frame(){t++;
cb.clearRect(0,0,W,H);Ls.forEach(o=>{o.y-=o.v;o.x+=Math.sin(o.y/70+o.p)*.25;if(o.y<-100){o.y=H+80;o.x=Math.random()*W}lantern(o)});
const n=Math.max(5,W/110|0),sp=W/n;for(let i=0;i<n;i++)diya(sp*(i+.5),H-26,i*1.7);
cx.globalCompositeOperation='destination-out';cx.fillStyle='rgba(0,0,0,.2)';cx.fillRect(0,0,W,H);cx.globalCompositeOperation='lighter';
if(Math.random()<.3)P.push({x:Math.random()*W,y:H+5,vx:(Math.random()-.5)*.4,vy:-.4-Math.random()*.9,l:400,m:400,h:40,s:1+Math.random()*1.6,e:1});
for(let i=R.length-1;i>=0;i--){const r=R[i];r.y+=r.vy;r.vy*=.987;P.push({x:r.x,y:r.y,vx:Math.random()-.5,vy:.6,l:20,m:20,h:40,s:1.5,g:.02,f:1});
if(r.y<r.ty||r.vy>-1.6){burst(r.x,r.y,80);burst(r.x,r.y,25,45);R.splice(i,1)}}
for(let i=E.length-1;i>=0;i--){const e=E[i];for(let k=0;k<4;k++)P.push({x:e.x,y:H-6,vx:(Math.random()-.5)*2.4,vy:-5-Math.random()*4,l:60,m:60,h:30+Math.random()*20,s:1.5,g:.12,f:.99});if(--e.t<0)E.splice(i,1)}
for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;if(!p.e){p.vx*=p.f;p.vy=p.vy*p.f+p.g}p.l--;if(p.l<=0||p.y<-10){P.splice(i,1);continue}
const a=p.e?Math.min(1,p.l/80)*(.55+.45*Math.sin(p.l/8)):p.l/p.m;cx.fillStyle=`hsla(${p.h},100%,62%,${a})`;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill()}
requestAnimationFrame(frame)}
const rocket=()=>R.push({x:W*(.1+Math.random()*.8),y:H,vy:-9-Math.random()*3,ty:H*(.12+Math.random()*.33)});
frame();rocket();setInterval(rocket,1500);setInterval(()=>E.push({x:W*(.08+Math.random()*.84),t:150}),4500);
go(0);fxOn=1;
</script></body></html>
